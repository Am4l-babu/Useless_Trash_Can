; =============================================================================
;  TRASHBOT CAM - an ESP32-CAM (AI-Thinker) that lends the bin its eyes.
;
;  It does no detection itself: it joins the bin's network and serves JPEG
;  snapshots with permissive CORS, so the phone's VISION tab can run the
;  detector on them instead of on its own camera. See README.md.
;
;    pio run -t upload    (hold IO0 to GND while resetting on boards without
;                          the auto-programmer; or use an ESP32-CAM-MB base)
; =============================================================================
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

build_src_filter =
    +<*>
    -<.pio/>
