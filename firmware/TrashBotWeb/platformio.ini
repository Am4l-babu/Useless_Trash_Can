; =============================================================================
;  TRASHBOT WEB REMOTE - PlatformIO build.
;
;  The sketch is also a valid Arduino IDE project (TrashBotWeb.ino plus the
;  src/ tree), so it can be flashed either way. src_dir is pointed at the
;  project root so both tools see the same layout.
;
;    pio run                 build
;    pio run -t upload       flash the firmware
;    pio run -t uploadfs     flash data/ to LittleFS  (do this too, or the
;                            board serves the minimal fallback page)
;
;  Partition table: no_ota.csv. Wi-Fi + async web + NimBLE is about 1.3 MB of
;  app, and the sound clips need room, so the default 1.3 MB app / 1.5 MB FS
;  split is replaced by 2 MB app / 1.9 MB FS. Reflashing over the old layout
;  wipes the clips - re-upload them or `pio run -t uploadfs` again.
; =============================================================================
[platformio]
src_dir = .
data_dir = data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0
    h2zero/NimBLE-Arduino@^2.1.0

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; Peripheral role only: smaller host, less RAM, and the bin never scans.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3

build_src_filter =
    +<*>
    -<.pio/>
    -<data/>
