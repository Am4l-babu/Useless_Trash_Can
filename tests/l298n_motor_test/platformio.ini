; Bench test project for the L298N motor driver bring-up.
; Not part of the BIN-CHAD build - see src/main.ino for wiring and behavior.
;
; The motor driver now lives on an Arduino UNO Q (STM32U585 MCU side,
; Zephyr-based Arduino core), not the ESP32 this used to target. There is
; no official PlatformIO board definition for UNO Q yet (only a third-party
; community platform), so this sketch is meant to be opened and uploaded
; from the Arduino IDE (2+) with Board: "Arduino UNO Q" selected instead.
; This platformio.ini is left here for reference only and will not build
; src/main.ino as written (it uses standard analogWrite(), not ESP32 ledc).
